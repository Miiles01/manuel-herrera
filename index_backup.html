<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Preloader Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #111; color: #fff; font-family: 'Space Grotesk', sans-serif; }
    
    .loader-container { 
      position: fixed; 
      inset: 0; 
      z-index: 50; 
      background: #000; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    
    .image-sequence { 
      position: relative; 
      width: 100vw; 
      height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    
    .seq-image { 
      position: absolute; 
      width: 40vw; 
      height: 50vh; 
      object-fit: cover; 
      border-radius: 20px; 
      opacity: 0; 
      transform: scale(0.1); 
      will-change: transform, opacity;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    
    .loader-text { 
      position: absolute; 
      z-index: 10; 
      font-size: clamp(2rem, 5vw, 4rem); 
      text-align: center; 
      pointer-events: none; 
      white-space: pre-line;
      color: white;
      mix-blend-mode: difference;
      letter-spacing: -0.04em;
    }
    
    .main-content { 
      opacity: 0; 
      padding: 4rem 2rem; 
      font-size: 1.5rem; 
      text-align: center; 
      height: 200vh;
      background: linear-gradient(to bottom, #111, #333);
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <div class="loader-text">Build your
Legacy</div>
    <div class="image-sequence" id="sequence">
      <!-- Secuencia de imagenes (placeholders) -->
      <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop" class="seq-image" alt="Project 1">
      <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=1200&auto=format&fit=crop" class="seq-image" alt="Project 2">
      <img src="https://images.unsplash.com/photo-1542744173-8e7e53415bb0?q=80&w=1200&auto=format&fit=crop" class="seq-image" alt="Project 3">
      <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=1200&auto=format&fit=crop" class="seq-image" alt="Project 4">
      <img src="https://images.unsplash.com/photo-1600132806370-bf17e65e942f?q=80&w=1200&auto=format&fit=crop" class="seq-image" alt="Project 5">
      <img src="https://images.unsplash.com/photo-1558655146-d09347e92766?q=80&w=1200&auto=format&fit=crop" class="seq-image" alt="Project 6">
    </div>
  </div>

  <div class="main-content">
    <h1 class="text-4xl font-bold mb-8">Bienvenido a la página principal</h1>
    <p class="text-gray-400">El loader ha terminado de reproducirse y el contenido real ahora es visible.</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const images = document.querySelectorAll('.seq-image');
      
      // Timeline principal
      const tl = gsap.timeline({
        onComplete: () => {
          // Desvanecer el contenedor del loader
          gsap.to('.loader-container', { 
            opacity: 0, 
            duration: 0.8, 
            display: 'none', 
            ease: 'power2.inOut' 
          });
          // Mostrar el contenido principal
          gsap.to('.main-content', { 
            opacity: 1, 
            duration: 1, 
            delay: 0.2 
          });
          // Restaurar scroll
          document.body.style.overflow = 'auto';
        }
      });

      // Asegurarse de que haya un pequeño retraso inicial antes de arrancar
      tl.addLabel("start", 0.5);

      images.forEach((img, index) => {
        const imgTl = gsap.timeline();
        
        // Efecto: zoom in rápido y desvanecimiento
        imgTl.fromTo(img, 
          { scale: 0.1, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: 'power2.out' }
        ).to(img, 
          { scale: 3.5, opacity: 0, duration: 0.5, ease: 'power2.in' },
          "+=0.1" // Breve pausa en el centro antes de hacer zoom past the camera
        );

        // Agregamos a la timeline principal intercalando con un 'stagger'
        // Cada imagen inicia 0.25 segundos después de la anterior
        tl.add(imgTl, "start+=" + (index * 0.25));
      });
    });
  </script>
</body>
</html>
